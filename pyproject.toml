[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dhcpv6-api"
description = "REST API for managing a Kea DHCPv6 server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.version]
path = "src/dhcpv6_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dhcpv6_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]
