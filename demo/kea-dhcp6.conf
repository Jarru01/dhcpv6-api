// Demo config: same as config/kea-dhcp6.conf, but Kea does not bind to any
// interface (a container has no ens4), so it serves the API without handing
// out real leases.
{
  "Dhcp6": {
    "interfaces-config": { "interfaces": [] },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "lfc-interval": 3600,
      "name": "/var/lib/kea/kea-leases6.csv"
    },
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "preferred-lifetime": 3000,
    "valid-lifetime": 4000,
    "option-data": [
      { "name": "dns-servers", "data": "2001:4860:4860::8888, 2001:4860:4860::8844" },
      { "name": "domain-search", "data": "example.local" }
    ],
    "subnet6": [
      {
        "id": 1,
        "subnet": "fd00::/64",
        "pools": [ { "pool": "fd00::100 - fd00::1ff" } ],
        "option-data": [
          { "name": "dns-servers", "data": "2001:4860:4860::8888, 2001:4860:4860::8844" }
        ]
      }
    ],
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea6-ctrl-socket"
    },
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
