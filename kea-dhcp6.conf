{
  "Dhcp6": {

    "interfaces-config": {
      "interfaces": ["ens4"]
      // rozhranie na ktorom Kea pocuva na DHCPv6 poziadavky klientov (UDP port 547)
      // ens4 = privatna siet 192.168.1.0/24 / fd00::/64
    },

    "lease-database": {
      "type": "memfile",        // typ uloziska - memfile = CSV subor na disku
      "persist": true,          // leasy sa ukladaju na disk (pretrvaju restart)
      "lfc-interval": 3600,     // interval cistenia stareho suboru s leasmi v sekundach
      "name": "/var/lib/kea/kea-leases6.csv"  // cesta k CSV suboru s leasmi
    },

    // timery pre DHCPv6 leasy - v sekundach
    "renew-timer": 1000,        // T1: kedy klient zacne obnovu leasu (posle Renew)
    "rebind-timer": 2000,       // T2: kedy klient skusi iny server ak renew zlyha (posle Rebind)
    "preferred-lifetime": 3000, // cas pocas ktoreho je adresa preferovana
    "valid-lifetime": 4000,     // cas pocas ktoreho je adresa platna (po expiraci sa uvolni)

    // globalne options - platia pre vsetky subnety ak nie su prepisane na urovni subnetu
    "option-data": [
      {
        "name": "dns-servers",  // DHCPv6 option 23 - adresy DNS serverov pre klientov
        "data": "2001:4860:4860::8888, 2001:4860:4860::8844"  // Google IPv6 DNS
      },
      {
        "name": "domain-search", // DHCPv6 option 24 - domenovy hladaci zoznam
        "data": "example.local"
      }
    ],

    "subnet6": [
      {
        "id": 1,                      // unikatne ID subnetu - pouziva sa aj v REST API
        "subnet": "fd00::/64",        // KRITICKE: musi zodpovedat adrese na ens4 (fd00::1/64)
        "interface": "ens4",          // rozhranie pre tento subnet

        // rozsah adries ktore Kea pridzeli klientom
        "pools": [
          {
            "pool": "fd00::100 - fd00::1ff"  // 256 adries: fd00::100 az fd00::1ff
          }
        ],

        // options na urovni subnetu - prepisuju globalne options pre tento subnet
        "option-data": [
          {
            "name": "dns-servers",    // DHCPv6 option 23
            "data": "2001:4860:4860::8888, 2001:4860:4860::8844"
          },
          {
            "name": "domain-search", // DHCPv6 option 24
            "data": "example.local"
          }
        ]
      }
    ],

    // control socket - umoznuje REST API komunikovat s Kea serverom bez restartu sluzby
    // pouziva sa na config-reload prikaz v kea.py (reload_kea funkcia)
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea6-ctrl-socket"  // UNIX socket subor
    },

    // konfiguracia logovania
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          {
            "output": "/var/log/kea/kea-dhcp6.log",  // cesta k log suboru
            "maxsize": 2048000,   // maximalny rozmer log suboru v bajtoch (cca 2 MB)
            "maxver": 4           // pocet rotovanych log suborov
          }
        ],
        "severity": "INFO"        // uroven logovania: DEBUG / INFO / WARN / ERROR
      }
    ]

  }
}
