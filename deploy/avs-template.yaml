heat_template_version: ocata

description: >
  DHCPv6 lab topology - a Debian router/server (radvd + Kea DHCPv6 + REST API)
  and one client on a private network behind it. Access is SSH key only.

parameters:
  project_name:
    type: string
    label: Project name (prefix for all resource names)
  ssh_public_key:
    type: string
    label: SSH public key installed for the admin user
  admin_user:
    type: string
    default: avs
  image_server:
    type: string
    default: debian-12-kis
  image_client:
    type: string
    default: debian-12-kis
  flavor_server:
    type: string
    default: 4c4r40d
  flavor_client:
    type: string
    default: 2c2r20d
  zone:
    type: string
    default: nova
  ext_net:
    type: string
    default: ext-net-154
  ext_subnet:
    type: string
    default: EXT154

resources:
  private_net:
    type: OS::Neutron::Net
    properties:
      name: { list_join: [ '_', [ { get_param: project_name }, 'net_server' ] ] }

  private_subnet:
    type: OS::Neutron::Subnet
    properties:
      network: { get_resource: private_net }
      cidr: 192.168.1.0/24
      enable_dhcp: false

  #### ROUTER / DHCPv6 SERVER ####
  server_router:
    type: OS::Nova::Server
    properties:
      name: { list_join: [ '-', [ { get_param: project_name }, 'server' ] ] }
      flavor: { get_param: flavor_server }
      image: { get_param: image_server }
      config_drive: true
      networks:
        - port: { get_resource: router_external_port }
        - port: { get_resource: router_internal_port }
      availability_zone: { get_param: zone }
      user_data_format: RAW
      user_data:
        str_replace:
          params:
            $ADMIN_USER: { get_param: admin_user }
            $SSH_KEY: { get_param: ssh_public_key }
          template: |
            #!/bin/bash
            set -eu
            ip route del 0.0.0.0/0 via 192.168.1.1 || true

            # 1. IPv4 forwarding (IPv6 forwarding comes from config/99-ipv6.conf)
            echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/98-ipv4.conf
            sysctl --system

            # 2. Firewall. The REST API (port 8000) is only reachable from the
            #    private network (ens4); use an SSH tunnel to reach it from outside.
            apt-get update && apt-get install -y nftables
            cat <<'EOF' > /etc/nftables.conf
            flush ruleset
            table inet filter {
                chain input {
                    type filter hook input priority 0; policy drop;
                    iif "lo" accept
                    ct state established,related accept
                    meta l4proto ipv6-icmp accept
                    tcp dport 22 accept
                    iifname "ens4" accept
                }
                chain forward {
                    type filter hook forward priority 0; policy drop;
                    ct state established,related accept
                    ip daddr 192.168.1.2 tcp dport 22 accept
                    iifname "ens4" accept
                }
            }
            table ip nat {
                chain prerouting {
                    type nat hook prerouting priority -100;
                    iifname "ens3" tcp dport 2022 dnat to 192.168.1.2:22
                }
                chain postrouting {
                    type nat hook postrouting priority 100;
                    oifname "ens3" masquerade
                }
            }
            EOF
            nft -f /etc/nftables.conf
            systemctl enable nftables

            # 3. Admin user with key-based SSH only
            useradd -m -s /bin/bash -G sudo "$ADMIN_USER"
            install -d -m 700 -o "$ADMIN_USER" -g "$ADMIN_USER" "/home/$ADMIN_USER/.ssh"
            echo "$SSH_KEY" > "/home/$ADMIN_USER/.ssh/authorized_keys"
            chown "$ADMIN_USER:$ADMIN_USER" "/home/$ADMIN_USER/.ssh/authorized_keys"
            chmod 600 "/home/$ADMIN_USER/.ssh/authorized_keys"
            echo "$ADMIN_USER ALL=(ALL) NOPASSWD:ALL" > "/etc/sudoers.d/90-$ADMIN_USER"

  router_external_port:
    type: OS::Neutron::Port
    properties:
      network: { get_param: ext_net }
      fixed_ips:
        - subnet: { get_param: ext_subnet }

  router_internal_port:
    type: OS::Neutron::Port
    properties:
      network: { get_resource: private_net }
      fixed_ips:
        - ip_address: 192.168.1.1

  #### CLIENT ####
  client:
    type: OS::Nova::Server
    properties:
      name: { list_join: [ '-', [ { get_param: project_name }, 'client' ] ] }
      flavor: { get_param: flavor_client }
      image: { get_param: image_client }
      config_drive: true
      networks:
        - port: { get_resource: client_port }
      availability_zone: { get_param: zone }
      user_data_format: RAW
      user_data:
        str_replace:
          params:
            $HOSTNAME: { list_join: [ '-', [ { get_param: project_name }, 'client' ] ] }
            $ADMIN_USER: { get_param: admin_user }
            $SSH_KEY: { get_param: ssh_public_key }
          template: |
            #!/bin/bash
            set -eu
            hostnamectl set-hostname "$HOSTNAME"

            # Static IPv4 on the private network; IPv6 comes from radvd + Kea
            cat <<'EOF' > /etc/network/interfaces.d/ens3
            auto ens3
            iface ens3 inet static
                address 192.168.1.2
                netmask 255.255.255.0
                gateway 192.168.1.1
                dns-nameservers 8.8.8.8 1.1.1.1
            EOF
            systemctl restart networking || (ip addr add 192.168.1.2/24 dev ens3 && ip route add default via 192.168.1.1)

            useradd -m -s /bin/bash -G sudo "$ADMIN_USER"
            install -d -m 700 -o "$ADMIN_USER" -g "$ADMIN_USER" "/home/$ADMIN_USER/.ssh"
            echo "$SSH_KEY" > "/home/$ADMIN_USER/.ssh/authorized_keys"
            chown "$ADMIN_USER:$ADMIN_USER" "/home/$ADMIN_USER/.ssh/authorized_keys"
            chmod 600 "/home/$ADMIN_USER/.ssh/authorized_keys"
            echo "$ADMIN_USER ALL=(ALL) NOPASSWD:ALL" > "/etc/sudoers.d/90-$ADMIN_USER"

  client_port:
    type: OS::Neutron::Port
    properties:
      network: { get_resource: private_net }
      fixed_ips:
        - ip_address: 192.168.1.2
