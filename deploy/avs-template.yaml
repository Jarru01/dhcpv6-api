heat_template_version: ocata

description: SOS Topology - Fixed with Config Drive, User "avs", and SSH Password Auth

parameters:
  nazov_projektu:
    type: string
    label: Nazov projektu
  image_server_linux:
    type: string
    default: debian-12-kis
  image_klient:
    type: string
    default: debian-12-kis
  flavor_server_linux:
    type: string
    default: 4c4r40d
  flavor_klient:
    type: string
    default: 2c2r20d
  zone:
    type: string
    default: nova
  ext-net:
    default: ext-net-154
    type: string

resources:
  siet_server:
    type: OS::Neutron::Net
    properties:
      name: { list_join: [ '_', [ { get_param: nazov_projektu }, 'net_server' ] ] }

  subnet_server:
    type: OS::Neutron::Subnet
    properties:
      network: { get_resource : siet_server }
      cidr: 192.168.1.0/24
      enable_dhcp: false

#### ROUTER ####
  server_router:
    type: OS::Nova::Server
    properties:
      name: { list_join: [ '-', [ { get_param: nazov_projektu }, 'server' ] ] }
      flavor: { get_param: flavor_server_linux }
      image: { get_param: image_server_linux }
      config_drive: True
      networks:
        - port: { get_resource: router_external_port }
        - port: { get_resource: router_internal_port1 }
      availability_zone: { get_param: zone }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        /sbin/ip route del 0.0.0.0/0 via 192.168.1.1
        /sbin/ip route del 0.0.0.0/0 via 192.168.2.1
        # 1. Enable Forwarding
        echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
        sysctl -p

        # 2. Setup nftables
        apt-get update && apt-get install -y nftables
        cat <<EOF > /etc/nftables.conf
        flush ruleset
        table inet filter {
            chain input {
                type filter hook input priority 0; policy drop;
                iif "lo" accept
                ct state established,related accept
                tcp dport 22 accept
                tcp dport 8000 accept
                iifname "ens4" accept
            }
            chain forward {
                type filter hook forward priority 0; policy drop;
                ct state established,related accept
                ip daddr 192.168.1.2 tcp dport 22 accept
                iifname "ens4" oifname "ens3" accept
                iifname "ens4" accept
            }
        }
        table ip nat {
            chain prerouting {
                type nat hook prerouting priority -100;
                iifname "ens3" tcp dport 2022 dnat to 192.168.1.2:22
            }
            chain postrouting {
                type nat hook postrouting priority 100;
                oifname "ens3" masquerade
            }
        }
        EOF

        /usr/sbin/nft -f /etc/nftables.conf
        systemctl enable nftables
        systemctl restart nftables

        # 3. Add user avs and enable SSH password auth
        useradd -m -s /bin/bash avs
        echo "avs:avs" | chpasswd
        usermod -aG sudo avs
        sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        systemctl restart ssh
        systemctl restart sshd

  router_external_port:
    type: OS::Neutron::Port
    properties:
      network: { get_param: ext-net }
      fixed_ips:
        - subnet: EXT154

  router_internal_port1:
    type: OS::Neutron::Port
    properties:
      network: { get_resource: siet_server }
      fixed_ips:
        - ip_address: 192.168.1.1

#### CLIENT ####
  server_1:
    type: OS::Nova::Server
    properties:
      name: { list_join: [ '-', [ { get_param: nazov_projektu }, 'client' ] ] }
      flavor: { get_param: flavor_klient }
      image: { get_param: image_klient }
      config_drive: True
      networks:
        - port: { get_resource: server1_port }
      availability_zone: { get_param: zone }
      user_data_format: RAW
      user_data:
        str_replace:
          template: |
            #!/bin/bash
            # 1. Identity
            hostnamectl set-hostname $hostname
            
            # 2. Manual Network config for ens3
            cat <<EOF > /etc/network/interfaces.d/ens3
            auto ens3
            iface ens3 inet static
                address 192.168.1.2
                netmask 255.255.255.0
                gateway 192.168.1.1
                dns-nameservers 8.8.8.8 1.1.1.1
            EOF
            
            # Restart networking to apply
            systemctl restart networking || (ip addr add 192.168.1.2/24 dev ens3 && ip route add default via 192.168.1.1)

            # 3. Add user avs and enable SSH password auth
            useradd -m -s /bin/bash avs
            echo "avs:avs" | chpasswd
            usermod -aG sudo avs
            sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
            sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
            systemctl restart ssh
            systemctl restart sshd
          params:
            $hostname: { list_join: [ '-', [ { get_param: nazov_projektu }, 'client' ] ] }

  server1_port:
    type: OS::Neutron::Port
    properties:
      network: { get_resource: siet_server }
      fixed_ips:
        - ip_address: 192.168.1.2