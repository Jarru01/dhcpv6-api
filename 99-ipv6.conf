# Subor: /etc/sysctl.d/99-ipv6.conf
# Ucel: povolenie IPv6 forwardingu - server funguje ako IPv6 router/gateway pre privatnu siet
# Nacitanie bez restartu: sudo sysctl --system
# Overenie: sysctl net.ipv6.conf.all.forwarding  →  musi byt = 1

# povoli preposielanie IPv6 paketov medzi rozhraniami (ens3 <-> ens4)
net.ipv6.conf.all.forwarding = 1

# accept_ra = 2 - ked je povoleny forwarding, kernel by inak ignoroval Router Advertisement
# aj na ens3 (internet rozhranie). Hodnota 2 zachovava akceptovanie RA aj pri forwardingu
net.ipv6.conf.all.accept_ra = 2

# ens3 (public internet) - akceptuje RA od upstream providera (ak ho posiela)
net.ipv6.conf.ens3.accept_ra = 1

# ens4 (privatna siet) - server sam posiela RA cez radvd, takze neakceptuje cudzie RA
net.ipv6.conf.ens4.accept_ra = 0
