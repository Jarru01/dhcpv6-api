# /etc/sysctl.d/99-ipv6.conf
# The server routes IPv6 between the private network (ens4) and the uplink (ens3).
# Apply without reboot: sudo sysctl --system

net.ipv6.conf.all.forwarding = 1

# With forwarding enabled the kernel ignores Router Advertisements unless
# accept_ra = 2, so the uplink needs 2 to keep learning a route from upstream.
net.ipv6.conf.ens3.accept_ra = 2

# The private side is advertised by our own radvd; never accept foreign RAs here.
net.ipv6.conf.ens4.accept_ra = 0
