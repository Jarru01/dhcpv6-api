// /etc/kea/kea-dhcp6.conf
// Kea accepts comments in its config; the API strips them when reading.
// Note: the API rewrites this file as plain JSON, so comments are lost after
// the first change made through the API. This annotated copy is the reference.
{
  "Dhcp6": {
    // Interface Kea listens on for client requests (UDP 547) - the private network
    "interfaces-config": {
      "interfaces": ["ens4"]
    },

    // Leases are kept in a CSV file and survive restarts.
    // lfc-interval: how often (s) Kea compacts the append-only lease file.
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "lfc-interval": 3600,
      "name": "/var/lib/kea/kea-leases6.csv"
    },

    // Lease timers in seconds; must satisfy renew < rebind < preferred <= valid
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "preferred-lifetime": 3000,
    "valid-lifetime": 4000,

    // Global options apply to every subnet unless a subnet overrides them
    "option-data": [
      { "name": "dns-servers", "data": "2001:4860:4860::8888, 2001:4860:4860::8844" },
      { "name": "domain-search", "data": "example.local" }
    ],

    "subnet6": [
      {
        // The REST API addresses subnets by this id
        "id": 1,
        // Must match the server's address on ens4 (fd00::1/64)
        "subnet": "fd00::/64",
        "interface": "ens4",
        "pools": [
          { "pool": "fd00::100 - fd00::1ff" }
        ],
        "option-data": [
          { "name": "dns-servers", "data": "2001:4860:4860::8888, 2001:4860:4860::8844" },
          { "name": "domain-search", "data": "example.local" }
        ]
      }
    ],

    // The REST API talks to the running server through this socket
    // (config-test, config-reload, status-get)
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea6-ctrl-socket"
    },

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          { "output": "/var/log/kea/kea-dhcp6.log", "maxsize": 2048000, "maxver": 4 }
        ],
        "severity": "INFO"
      }
    ]
  }
}
