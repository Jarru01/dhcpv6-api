# /etc/radvd.conf
# Router Advertisements on the private network. The M and O flags tell clients
# to get both their address and other settings (DNS, ...) from DHCPv6 (Kea);
# SLAAC is disabled, so every address is assigned and tracked by Kea.
#
# Enable:  sudo systemctl enable --now radvd
# Verify:  sudo tcpdump -i ens4 -v 'icmp6 and ip6[40] == 134'   (RA every 10-30 s)

interface ens4
{
    AdvSendAdvert on;
    MinRtrAdvInterval 10;
    MaxRtrAdvInterval 30;
    # M flag: addresses via DHCPv6
    AdvManagedFlag on;
    # O flag: other configuration (DNS, domain search) via DHCPv6
    AdvOtherConfigFlag on;
    AdvDefaultLifetime 1800;

    prefix fd00::/64
    {
        AdvOnLink on;
        # No SLAAC - Kea is the only source of addresses
        AdvAutonomous off;
        AdvRouterAddr on;
        AdvValidLifetime 3600;
        AdvPreferredLifetime 1800;
    };

    # OpenStack VXLAN networks have an MTU of 1442, not 1500. If the advertised
    # MTU is larger than the interface MTU, radvd silently stops sending RAs
    # (nothing in the log), and clients get neither a prefix nor a gateway.
    # Check with: ip link show ens4
    AdvLinkMTU 1442;
};
