# Subor: /etc/radvd.conf
# Ucel: konfiguracia Router Advertisement daemona
# radvd informuje klientov o IPv6 sieti, gateway a o existencii DHCPv6 servera
# Spustenie:  sudo systemctl enable --now radvd
# Overenie:   sudo tcpdump -i ens4 -v 'icmp6 and ip6[40] == 134'
#             (cekat max 35 sekund - musia prichodit RA pakety)

interface ens4   # rozhranie na ktore server posiela RA spravy (privatna siet)
{
    AdvSendAdvert on;           # povoli odosielanie Router Advertisement sprav
    MinRtrAdvInterval 10;       # minimalna pauza medzi RA spravami v sekundach
    MaxRtrAdvInterval 30;       # maximalna pauza medzi RA spravami v sekundach
    AdvManagedFlag on;          # M-bit: klient ma pouzit DHCPv6 pre ziskanie adresy (nie SLAAC)
    AdvOtherConfigFlag on;      # O-bit: klient ma pouzit DHCPv6 aj pre ostatne info (DNS atd.)
    AdvDefaultLifetime 1800;    # ako dlho je server platny ako default gateway (v sekundach)

    prefix fd00::/64            # IPv6 prefix oznamovany klientom
    {
        AdvOnLink on;           # prefix je priamo na linke (klienti su v rovnakej sieti)
        AdvAutonomous off;      # zakaze SLAAC - adresu prideluje VYHRADNE Kea DHCPv6 server
        AdvRouterAddr on;       # do RA vlozi aj adresu routera (fd00::1)
        AdvValidLifetime 3600;  # ako dlho je prefix platny (v sekundach)
        AdvPreferredLifetime 1800; # ako dlho je adresa preferovana (v sekundach)
    };

    # KRITICKE: v OpenStack prostredí je MTU rozhrania 1442 (VXLAN overhead znizuje 1500→1442)
    # Ak je tu 1500, radvd to detekuje a TICHO prestane posielat RA spravy - bez chyby v logu!
    # Klienti tak nedostanu ani prefix ani default gateway
    # Vzdy skontroluj: ip link show ens4 | grep mtu
    AdvLinkMTU 1442;
};
