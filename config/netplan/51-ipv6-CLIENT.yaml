# /etc/netplan/51-ipv6-CLIENT.yaml
# Enables the DHCPv6 client on the client's only interface. systemd-networkd
# waits for a Router Advertisement from radvd (M flag set) and then requests
# an address from Kea. Merged with 50-cloud-init.yaml.

network:
  version: 2
  ethernets:
    ens3:
      dhcp6: true
      nameservers:
        # cloud-init leaves no resolvers on this image; set them persistently
        addresses:
          - 8.8.8.8
          - 1.1.1.1
