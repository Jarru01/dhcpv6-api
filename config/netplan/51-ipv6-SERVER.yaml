# /etc/netplan/51-ipv6-SERVER.yaml
# Adds a static IPv6 address to the private interface. Netplan merges this with
# 50-cloud-init.yaml (files are applied in lexical order), so the IPv4 setup
# from cloud-init is kept.

network:
  version: 2
  ethernets:
    ens4:
      addresses:
        # Server address and default gateway for clients; must be inside the
        # Kea subnet (fd00::/64)
        - fd00::1/64
